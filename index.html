<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Posse</title>
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M9 17l5 5 9-12' fill='none' stroke='white' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f8fb;--card:#ffffff;--ink:#0d1220;--muted:#647089;--line:#e5e8f0;
  --accent:#4f46e5;--accent2:#06b6d4;--accent-ink:#ffffff;--soft:#eef0ff;--warn:#b45309;--warn-soft:#fff6e8;--bad:#dc2626;--ok:#059669;
  --grad:linear-gradient(135deg,#4f46e5,#06b6d4);--shadow:0 1px 2px rgba(13,18,32,.04),0 6px 20px rgba(13,18,32,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0a0d16;--card:#111624;--ink:#e8ebf4;--muted:#8a94ad;--line:#1f2638;
  --accent:#818cf8;--accent2:#22d3ee;--accent-ink:#0a0d16;--soft:#1b2040;--warn:#f5b453;--warn-soft:#2a2214;--bad:#f87171;--ok:#34d399;
  --grad:linear-gradient(135deg,#6366f1,#06b6d4);--shadow:none;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.mono,.stat b,.clock,td.num{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace}
header.old{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 8px;gap:10px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.brand{font-weight:700;font-size:20px;letter-spacing:-.04em;line-height:1}
.brand span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:13px}
#hdr{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
.pill{font-family:"JetBrains Mono",monospace;font-size:12px;padding:5px 10px;border-radius:999px;background:var(--soft);color:var(--accent);white-space:nowrap}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
nav button{border:0;background:none;color:var(--muted);padding:7px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--ink);color:var(--bg)}
main{padding:20px 0 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
h2{font-size:17px;margin:0 0 10px;letter-spacing:-.01em}h3{font-size:15px;margin:0 0 6px}
.hero{margin:2px 0 16px}.hero h1{font-size:24px;letter-spacing:-.03em;margin:0}.hero p{margin:4px 0 0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:20px}.stat small{color:var(--muted);font-size:12px}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
.item{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item.done{opacity:.5}.item.done .t{text-decoration:line-through}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--accent);margin-right:6px;text-transform:uppercase;letter-spacing:.04em}
.tag.rev{background:var(--warn-soft);color:var(--warn)}
.tag.ia{background:var(--grad);color:#fff}
.item .body{flex:1;min-width:0}.item .t{font-weight:600}.item .d{color:var(--muted);font-size:13px}
.temas{font-size:12.5px;color:var(--muted);margin-top:4px}.temas b{color:var(--ink);font-weight:600}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
button,.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-block}
button:hover,.btn:hover{border-color:var(--muted)}
button.pri{background:var(--grad);color:#fff;border-color:transparent}
button.ghost{border-color:transparent;background:none;color:var(--muted)}
button:disabled{opacity:.5;cursor:default}
.check{width:24px;height:24px;flex:none;border-radius:50%;border:2px solid var(--line);margin-top:2px;cursor:pointer;background:none;padding:0}
.done .check{background:var(--grad);border-color:transparent}
.notice{background:var(--warn-soft);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.info{background:var(--soft);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.empty{color:var(--muted);text-align:center;padding:20px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 40%,transparent);border-color:var(--accent)}
textarea{min-height:110px;font-family:"JetBrains Mono",ui-monospace,Consolas,monospace;font-size:13px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.row{grid-template-columns:1fr}}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.days input{padding:6px 2px;text-align:center}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-weight:500;font-size:12px}
td input{padding:4px 6px;font-size:13px}
td.num,th.num{text-align:right}
.tablewrap{overflow-x:auto}
.disc-h{display:flex;gap:8px;align-items:center;margin-bottom:6px}.disc-h input{font-weight:600}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--grad)}
.prog{margin:6px 0 4px}
.ed{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}
.ed:first-of-type{border-top:0}
.ed.on .ed-n{color:var(--accent)}
.ed-n{font-weight:600}
.modal{position:fixed;inset:0;background:rgba(5,8,16,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal.on{display:flex}
.modal .card{width:100%;max-width:460px;margin:0;max-height:90vh;overflow:auto}
.focus{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center}
.focus.on{display:flex}
.clock{font-size:76px;font-weight:700;letter-spacing:-.03em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.small{font-size:12px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.chat{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow:auto;margin-bottom:10px}
.msg{padding:10px 14px;border-radius:14px;max-width:90%;white-space:pre-wrap;font-size:14px}
.msg.u{align-self:flex-end;background:var(--soft)}
.msg.a{align-self:flex-start;border:1px solid var(--line)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
.res{font-size:13px}.res li{margin:3px 0}
a{color:var(--accent)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px;border-radius:12px;text-align:left}
.seg button span{font-size:12px;color:var(--muted)}.seg button.on{border-color:var(--accent);background:var(--soft)}
@media (max-width:520px){.seg{grid-template-columns:1fr}}
/* ---------- Horários, agenda, onboarding ---------- */
.item .hora{flex:none;width:46px;font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:700;color:var(--accent);padding-top:2px;display:flex;flex-direction:column}
.item .hora span{font-size:11px;font-weight:500;color:var(--muted)}
.rot td{padding:6px}.rot tr.off td{opacity:.55}.rot input[type=time]{width:110px;padding:5px 6px}
.hrs{display:flex;align-items:center;gap:4px}.hrs input{width:62px;text-align:center;padding:5px 4px}.hrs button{width:30px;height:30px;padding:0;border-radius:8px;font-size:16px;line-height:1}.hrs span{color:var(--muted);font-size:12px}
.agenda{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.agenda .card{margin:0}.day.today{border-color:var(--accent)}
.slot{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}.slot:first-of-type{border-top:0}
.slot .mono{color:var(--accent);font-weight:700;flex:none;width:42px}.slot.rev .mono{color:var(--warn)}.slot.done{opacity:.45}.slot .t{font-weight:600}
.onb{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.onb .card{margin:0;position:relative}
.step{width:28px;height:28px;border-radius:9px;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:700;margin-bottom:10px;font-family:"JetBrains Mono",monospace}
@media (max-width:900px){.onb{grid-template-columns:1fr}}
/* ---------- Layout: menu lateral + painel ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--card);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:22px}
.side .logo{padding:0 8px}
nav{display:flex;flex-direction:column;gap:2px;overflow:visible;padding:0}
nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--muted);font-weight:500;text-align:left;width:100%}
nav button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;pointer-events:none}
nav button span{pointer-events:none}
nav button:hover{background:var(--bg);color:var(--ink)}
nav button.on{background:var(--soft);color:var(--accent)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.cd-card{border-radius:14px;padding:14px;background:var(--grad);color:#fff}
.cd-card b{font-family:"JetBrains Mono",monospace;font-size:28px;display:block;line-height:1.1}
.cd-card small{opacity:.85;font-size:12px}
.content{min-width:0}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 28px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.tb-l{display:flex;align-items:center;gap:10px;min-width:0}.tb-logo{display:none;flex:none}
.tb-t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.content .wrap{max-width:1120px;padding:0 28px}
.dash{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center}
.kpi .ic{width:38px;height:38px;border-radius:11px;background:var(--soft);color:var(--accent);display:grid;place-items:center;flex:none}
.kpi .ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.kpi b{display:block;font-family:"JetBrains Mono",monospace;font-size:19px;line-height:1.2}
.kpi small{color:var(--muted);font-size:12px}
.kpi .meta{font-size:11px;color:var(--muted)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.card-h h2{margin:0}
.ciclo{display:flex;flex-direction:column;gap:16px;align-items:center}.ciclo .leg{width:100%}
.ciclo svg{flex:none}
.leg{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;font-size:13px}
.leg div{display:flex;align-items:center;gap:8px}.leg i{width:10px;height:10px;border-radius:3px;flex:none}
.leg span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.leg em{font-style:normal;color:var(--muted);font-family:"JetBrains Mono",monospace;font-size:12px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:130px;margin-top:6px}
.week .col{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.week .track{width:100%;max-width:30px;flex:1;background:var(--bg);border-radius:8px;position:relative;overflow:hidden;display:flex;align-items:flex-end}
.week .fill{width:100%;background:var(--grad);border-radius:8px}
.week .goal{position:absolute;left:0;right:0;border-top:2px dashed var(--muted);opacity:.5}
.week .lb{font-size:11px;color:var(--muted)}.week .lb.hj{color:var(--accent);font-weight:700}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px;justify-content:start}
.heat i{width:12px;height:12px;border-radius:3px;background:var(--line)}
.disc-row{margin:10px 0}.disc-row .top2{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;gap:8px}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.dash{grid-template-columns:minmax(0,1fr)}}
.dash>div{min-width:0}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);z-index:15;gap:0}
  .side .logo,.side-foot{display:none}
  nav{flex-direction:row;width:100%;justify-content:space-around}
  nav button{flex-direction:column;gap:3px;font-size:10.5px;padding:6px 2px;width:auto;flex:1 1 0;min-width:0;align-items:center}
  nav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  nav button.on{background:none}
  .tb-logo{display:block}
  .topbar{padding:12px 16px}
  .content .wrap{padding:0 16px}
  main{padding-bottom:110px}
}
.reader{text-align:left}
.reader section+section{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.reader p{white-space:pre-line;margin:8px 0 0}
.reader .small{white-space:normal}
.reader details{margin-top:8px}
.reader summary,.library summary{cursor:pointer;color:var(--accent);font-weight:600}
.reader summary{padding:5px 0}
.reader .page-text{white-space:pre-line;padding:0 0 12px 12px;border-left:2px solid var(--line)}
.library-list{list-style:none;padding:0;margin:12px 0 0}
.library-list li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.library-list li :first-child{min-width:0;overflow-wrap:anywhere}
.focus:has(.focus-reader:not([hidden])){justify-content:flex-start;overflow:auto;gap:8px;padding-block:20px}
.focus-session{flex:none;display:flex;flex-direction:column;align-items:center;gap:8px}
.focus-reader{width:min(100%,720px);flex:1;min-height:140px;overflow:auto;margin:8px 0 0}
.focus:has(.focus-reader:not([hidden])) .clock{font-size:clamp(46px,10vw,72px);line-height:1.1}
.modal:has(.reader) .card{max-width:720px}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="logo">
    <svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true" style="flex:none"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#06b6d4"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#lg)"/><path d="M9 17l5 5 9-12" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="brand">posse<span>.</span></div></div>
  <nav id="nav">
    <button data-tab="hoje" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Painel</span></button>
    <button data-tab="editais"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></svg><span>Editais</span></button>
    <button data-tab="agenda"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Agenda</span></button>
    <button data-tab="materiais"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h5a3 3 0 0 1 3 3v12a3 3 0 0 0-3-3H4zM20 5h-5a3 3 0 0 0-3 3v12a3 3 0 0 1 3-3h5z"/></svg><span>Materiais</span></button>
    <button data-tab="ia"><svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg><span>IA</span></button>
    <button data-tab="desempenho"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Progresso</span></button>
    <button data-tab="ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Ajustes</span></button>
  </nav>
  <div class="side-foot" id="sideFoot"></div>
</aside>
<div class="content">
  <div class="topbar"><div class="tb-l">
    <svg class="tb-logo" width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#06b6d4"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#lg2)"/><path d="M9 17l5 5 9-12" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div style="min-width:0"><div class="tb-t" id="hdr"></div><div class="sub" id="hdrSub"></div></div></div>
    <span class="pill" id="countdown"></span></div>
  <main class="wrap" id="main"></main>
</div>
</div>

<div class="modal" id="modal"><div class="card" id="modalBody" role="dialog" aria-modal="true" aria-label="Posse" tabindex="-1"></div></div>
<div class="focus" id="focus">
  <div class="focus-session">
  <div class="small" id="focusTag"></div>
  <h2 id="focusTitle" style="margin:0;font-size:22px"></h2>
  <div class="clock" id="clock">00:00</div>

<script>
/* ============================================================
   POSSE — do edital à posse
   App pessoal de estudo para concursos (dados no navegador).
   ============================================================ */
const KEY='posse-v2';
const uid=()=>Math.random().toString(36).slice(2,10);
function iso(d){const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)}
const hoje=()=>iso(new Date());
function addDias(s,n){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)}
function diasEntre(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5)}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtH=m=>m>=60?`${Math.floor(m/60)}h${String(m%60).padStart(2,'0')}`:`${m}min`;

/* ===================== Modelos de edital =====================
   questoes = nº de questões da disciplina na prova (vira o peso).
   incid    = nº de questões do assunto em provas anteriores. */
const PRESETS=window.POSSE_PRESETS||[];

function novoAssunto(nome,incid=0){return{id:uid(),nome,incid:+incid||0,relev:null,temas:[],dominio:1,tecUrl:'',ultimoEstudo:null,questoes:0,acertos:0}}
function edDePreset(p){
  return{id:uid(),preset:p.id,nome:p.nome,cargo:p.cargo||'',banca:p.banca||'',dataProva:p.dataProva||'',nota:p.nota||'',provas:(p.provas||[]).map(x=>({...x})),
    disciplinas:p.disciplinas.map(d=>({id:uid(),nome:d.nome,peso:+d.questoes||1,
      assuntos:d.assuntos.map(a=>typeof a==='string'?novoAssunto(a):Array.isArray(a)?novoAssunto(a[0],a[1]):novoAssunto(a.nome,a.incid))}))};
}

/* ===================== Estado ===================== */
function novoEstado(){
  return{v:2,rotina:{horas:[0,120,120,120,120,120,180],inicio:['09:00','19:00','19:00','19:00','19:00','19:00','09:00'],pausa:10,bloco:50,qMeta:15},
    editais:[],ativo:null,sessoes:[],revisoes:[],missoes:{},ia:{prov:'gemini',key:'',model:'claude-opus-5-5',gkey:'',gmodel:'',gmodels:[]},chat:[]};
}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||S.v!==2)S=novoEstado();
if(!S.rotina.inicio)S.rotina.inicio=['09:00','19:00','19:00','19:00','19:00','19:00','09:00'];
if(S.rotina.pausa==null)S.rotina.pausa=10;
S.ia={prov:S.ia?.key?'claude':'gemini',key:'',model:'claude-opus-5-5',gkey:'',gmodel:'',gmodels:[],...S.ia};
const modoServidor=document.querySelector('meta[name="posse-server"]')?.content;
const iaDisponivel=()=>modoServidor?modoServidor==='ready':Boolean(S.ia.key);
const iaOn=()=>S.ia.prov==='gemini'?!!(S.ia.gkey&&S.ia.gmodel):iaDisponivel();
function salvar(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Não consegui salvar no navegador. Exporte um backup em Ajustes.')}}
const E=()=>S.editais.find(e=>e.id===S.ativo)||null;
const assuntosDe=e=>e?e.disciplinas.flatMap(d=>d.assuntos.map(a=>({...a,disc:d}))):[];
function acharAssunto(id){for(const e of S.editais)for(const d of e.disciplinas){const a=d.assuntos.find(x=>x.id===id);if(a)return{a,d,e}}return null}
const mKey=d=>`${S.ativo}|${d}`;

const MATERIAIS=window.POSSE_MATERIAIS||{trechos:[],arquivos:[]};
const presetDoEdital=e=>e?.preset??PRESETS.find(p=>p.nome===e?.nome&&p.cargo===e?.cargo)?.id;
const urlPdf=(nome,pagina)=>`biblioteca-local/${encodeURIComponent(nome)}${pagina?'#page='+pagina:''}`;

function materialDoAssunto({a,d,e}){
  const preset=presetDoEdital(e);
  return MATERIAIS.trechos.filter(m=>m.preset===preset&&m.disciplina===d.nome&&m.assunto===a.nome);
}

function leitorMaterial({a,d},materiais,noFoco=false){
  return `<div class="reader">${noFoco?'<h2>Material do bloco</h2>':`<div class="eyebrow">${esc(d.nome)}</div><h2>${esc(a.nome)}</h2>`}
    ${materiais.map(m=>`<section>${m.titulo!==a.nome?`<h3>${esc(m.titulo)}</h3>`:''}<p class="small">${esc(m.pdf)} · ${m.inicio===m.fim?'p. '+m.inicio:'pp. '+m.inicio+'–'+m.fim} do PDF</p>
      <p><a href="${esc(urlPdf(m.pdf,m.inicio))}" target="_blank" rel="noopener">Abrir PDF na página ${m.inicio} ↗</a></p>
      ${m.paginas.map((p,i)=>`<details ${i===0?'open':''}><summary>Página ${p.numero}</summary><p class="page-text">${esc(p.texto||'Veja esta página no PDF original.')}</p></details>`).join('')}
    </section>`).join('')}</div>`;
}

/* ===================== Motor de prioridade ===================== */
function prioridades(){
  const e=E();const lista=assuntosDe(e);if(!lista.length)return[];
  const maxInc=Math.max(0,...lista.map(a=>+a.incid||0));
  const temRel=lista.some(a=>a.relev!=null);
  const maxPeso=Math.max(1,...e.disciplinas.map(d=>+d.peso||0));
  const h=hoje();
  return lista.map(a=>{
    // incidência: contagem real de provas (70%) + relevância estimada pela IA (30%)
    let inc=.5;
    const cnt=maxInc?(+a.incid||0)/maxInc:null, rel=a.relev!=null?a.relev/100:null;
    if(cnt!=null&&rel!=null)inc=.7*cnt+.3*rel;else if(cnt!=null)inc=cnt;else if(rel!=null)inc=rel;else if(temRel)inc=.3;
    const peso=(+a.disc.peso||0)/maxPeso;
    const lacuna=(6-(+a.dominio||1))/5;
    const erro=a.questoes>=10?1-a.acertos/a.questoes:.5;
    const rec=a.ultimoEstudo?Math.min(1,diasEntre(a.ultimoEstudo,h)/14):1;
    const score=(.4+inc)*(.5+peso)*(.4+lacuna)*(.5+erro)*(.3+rec);
    return{...a,score,inc,motivo:motivo(inc,lacuna,erro,a)};
  }).sort((x,y)=>y.score-x.score);
}
function motivo(inc,lacuna,erro,a){
  const m=[];
  if(inc>=.6)m.push('muito cobrado');
  if(a.questoes>=10&&erro>=.4)m.push(`você erra ${Math.round(erro*100)}%`);
  if(!a.ultimoEstudo)m.push('ainda não estudado');else if(lacuna>=.6)m.push('domínio baixo');
  return m.join(' · ')||'manter em dia';
}

/* ===================== Missão do dia ===================== */
const TEMPOS_RESGATE=[15,30,60];
function montarItens(data,manter=[],excluir=new Set(),exclRev=new Set(),resgate=null){
  const dow=new Date(data+'T12:00:00').getDay();
  let budget=resgate??((+S.rotina.horas[dow]||0)-manter.reduce((s,i)=>s+i.min,0));
  const pausaResgate=resgate?(+S.rotina.pausa||0):0;
  const itens=[...manter];const usados=new Set([...manter.map(i=>i.assuntoId+i.tipo),...[...excluir].map(x=>x+'estudo')]);
  const ids=new Set(assuntosDe(E()).map(a=>a.id));
  let revBudget=Math.max(0,Math.round(budget*.4));
  if(resgate)revBudget=Math.max(15,revBudget);
  for(const r of S.revisoes.filter(r=>!r.feita&&r.due<=data&&ids.has(r.assuntoId)).sort((a,b)=>a.due.localeCompare(b.due))){
    if(revBudget<15||budget<15)break;
    if(usados.has(r.assuntoId+'revisao')||exclRev.has(r.id))continue;
    itens.push({id:uid(),tipo:'revisao',assuntoId:r.assuntoId,revId:r.id,min:15,qtd:10,feito:false});
    usados.add(r.assuntoId+'revisao');revBudget-=15;budget-=15+pausaResgate;
  }
  const bloco=+S.rotina.bloco||50;
  const qMeta=+S.rotina.qMeta||15;
  for(const a of prioridades()){
    if(budget<Math.min(resgate?15:25,bloco))break;
    if(usados.has(a.id+'estudo'))continue;
    const m=Math.min(bloco,budget);
    itens.push({id:uid(),tipo:'estudo',assuntoId:a.id,min:m,qtd:resgate?Math.ceil(qMeta*m/bloco):qMeta,feito:false,motivo:a.motivo});
    usados.add(a.id+'estudo');budget-=m+pausaResgate;
  }
  return itens;
}
function gerarMissao(data,manter=[],resgate=null){
  S.missoes[mKey(data)]={data,itens:montarItens(data,manter,undefined,undefined,resgate),resgate};
  salvar();return S.missoes[mKey(data)];
}
const hm=t=>{const[a,b]=String(t||'19:00').split(':').map(Number);return a*60+(b||0)};
const fmtHM=m=>`${String(Math.floor(m/60)%24).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
function horarios(itens,data){
  const dow=new Date(data+'T12:00:00').getDay();let t=hm(S.rotina.inicio[dow]);const p=+S.rotina.pausa||0;
  return itens.map(i=>{const s=t;t+=i.min+p;return{ini:fmtHM(s),fim:fmtHM(s+i.min)}});
}
function planoSemana(){
  const out=[],usados=new Set(),revs=new Set();
  for(let k=0;k<7;k++){
    const d=addDias(hoje(),k);
    const itens=k===0?missaoHoje().itens:montarItens(d,[],usados,revs);
    itens.forEach(i=>{if(i.tipo==='estudo')usados.add(i.assuntoId);if(i.revId)revs.add(i.revId)});
    out.push({d,itens});
  }
  return out;
}
const missaoHoje=()=>S.missoes[mKey(hoje())]||gerarMissao(hoje());
function replanejar(resgate=null){gerarMissao(hoje(),missaoHoje().itens.filter(i=>i.feito),resgate);render()}
function abrirResgate(){
  modal(`<h2>Modo resgate</h2><p>Quanto tempo você ainda tem hoje? Os blocos concluídos continuam na missão.</p>
  <div class="btns">${TEMPOS_RESGATE.map(min=>`<button class="pri" data-act="resgate" data-min="${min}">${min} min</button>`).join('')}
  <button class="ghost" data-act="close">Cancelar</button></div>`);
}
function refazerHoje(){delete S.missoes[mKey(hoje())];salvar()}
function pendenciaOntem(){const m=S.missoes[mKey(addDias(hoje(),-1))];return m?m.itens.filter(i=>!i.feito).length:0}
function streak(){const d0=new Set(S.sessoes.map(s=>s.data));let d=d0.has(hoje())?hoje():addDias(hoje(),-1),n=0;while(d0.has(d)){n++;d=addDias(d,-1)}return n}
function minutosDesde(n){const lim=addDias(hoje(),-(n-1));return S.sessoes.filter(s=>s.data>=lim).reduce((t,s)=>t+s.min,0)}

/* ===================== Registro ===================== */
function registrar(item,min,q,ac,dominio){
  const r=acharAssunto(item.assuntoId);if(!r)return;const a=r.a;
  S.sessoes.push({id:uid(),data:hoje(),assuntoId:a.id,tipo:item.tipo,min,q,ac});
  a.questoes+=q;a.acertos+=ac;a.ultimoEstudo=hoje();if(dominio)a.dominio=dominio;
  if(item.tipo==='estudo'){
    S.revisoes=S.revisoes.filter(x=>!(x.assuntoId===a.id&&!x.feita));
    [1,7,30].forEach(n=>S.revisoes.push({id:uid(),assuntoId:a.id,due:addDias(hoje(),n),feita:false}));
  }else if(item.revId){const rv=S.revisoes.find(x=>x.id===item.revId);if(rv)rv.feita=true}
  if(item.id)item.feito=true;salvar();render();
}

/* ===================== TecConcursos (link direcionado) ===================== */
function tecBotao(a){
  if(a.tecUrl)return`<a class="btn" href="${esc(a.tecUrl)}" target="_blank" rel="noopener">Questões no Tec ↗</a>`;

}

}

/* ===================== IA (Claude API) ===================== */
const API='https://api.anthropic.com/v1/messages';
/* ---------- Google Gemini (camada gratuita) ---------- */
const GAPI='https://generativelanguage.googleapis.com/v1beta';
async function geminiModelos(key){
  const r=await fetch(`${GAPI}/models?pageSize=200`,{headers:{'x-goog-api-key':key}});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j?.error?.message||`Erro ${r.status}`);
  return(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent'))
    .map(m=>m.name.replace('models/',''))
    .filter(n=>/gemini/.test(n)&&!/(image|tts|audio|live|embedding|vision|thinking-exp)/.test(n));
}
function melhorModelo(lista){
  // prefere "flash" estável (sem preview/exp) e a versão mais nova
  const v=n=>parseFloat((n.match(/gemini-(\d+(\.\d+)?)/)||[])[1]||0);
  const score=n=>v(n)*10+(/flash/.test(n)?5:0)-(/lite/.test(n)?2:0)-(/(preview|exp)/.test(n)?3:0)-(/latest/.test(n)?1:0);
  return[...lista].sort((a,b)=>score(b)-score(a))[0]||'';
}
function paraGemini(c){
  const arr=typeof c==='string'?[{type:'text',text:c}]:c;
  return arr.map(b=>b.type==='document'?{inline_data:{mime_type:b.source.media_type,data:b.source.data}}:{text:b.text});
}
async function gemini({system,content,web,maxTokens,historico}){
  if(!S.ia.gkey||!S.ia.gmodel)throw new Error('Configure o Gemini em Ajustes → IA.');
  const msgs=historico?historico.map(m=>({role:m.role==='assistant'?'model':'user',parts:paraGemini(m.content)})):[{role:'user',parts:paraGemini(content)}];
  const body={systemInstruction:{parts:[{text:system}]},contents:msgs,generationConfig:{maxOutputTokens:Math.min(maxTokens,65536)}};
  if(web)body.tools=[{google_search:{}}];
  const r=await fetch(`${GAPI}/models/${encodeURIComponent(S.ia.gmodel)}:generateContent`,{method:'POST',
    headers:{'content-type':'application/json','x-goog-api-key':S.ia.gkey},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(r.status===429)throw new Error('Limite gratuito do Gemini atingido. Espere um minuto (ou até amanhã) e tente de novo.');
  if(!r.ok)throw new Error(j?.error?.message||`Erro ${r.status} no Gemini`);
  const cand=j.candidates?.[0];
  if(!cand?.content)throw new Error(j.promptFeedback?.blockReason?'O Gemini bloqueou este pedido.':'O Gemini não respondeu. Tente de novo.');
  const texto=(cand.content.parts||[]).map(p=>p.text||'').join('');
  const fontes=(cand.groundingMetadata?.groundingChunks||[]).filter(g=>g.web).map(g=>({titulo:g.web.title,url:g.web.uri}));
  return{texto,fontes};
}
async function claude(args){
  if(S.ia.prov==='gemini')return gemini({maxTokens:16000,...args});
  const{system,content,web=false,maxTokens=16000,historico}=args;
  if(!iaDisponivel())throw new Error(modoServidor?'Configure ANTHROPIC_API_KEY no servidor.':'Configure sua chave da API em Ajustes → IA.');
  const messages=historico?[...historico]:[{role:'user',content}];
  const payload={model:S.ia.model||'claude-opus-5-5',max_tokens:maxTokens,system,messages};
  const headers={'content-type':'application/json'};
  let body={...payload,web};
  if(!modoServidor){
    Object.assign(headers,{'x-api-key':S.ia.key,'anthropic-version':'2026-10-21','anthropic-dangerous-direct-browser-access':'true'});
    body={...payload,output_config:{effort:'medium'}};
    if(payload.model!=='claude-haiku-5-5'){
      headers['anthropic-beta']='server-side-fallback-2026-07-01';
      body.fallbacks='default';
    }
    if(web)body.tools=[{type:'web_search_20260209',name:'web_search',max_uses:10}];
  }
  for(let i=0;i<6;i++){
    const r=await fetch(modoServidor?'/api/claude':API,{method:'POST',headers,body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j?.error?.message||`Erro ${r.status} na API`);
    if(j.stop_reason==='refusal')throw new Error('A IA recusou este pedido. Tente reformular.');
    if(j.stop_reason==='max_tokens')throw new Error('A resposta ficou incompleta. Tente com menos conteúdo.');
    if(!Array.isArray(j.content))throw new Error('O Claude retornou uma resposta inesperada.');
    if(j.stop_reason==='pause_turn'){messages.push({role:'assistant',content:j.content});continue}
    const texto=j.content.filter(b=>b.type==='text').map(b=>b.text).join('');
    const fontes=[];j.content.forEach(b=>{if(b.type==='web_search_tool_result'&&Array.isArray(b.content))b.content.forEach(x=>{if(/^https?:\/\//i.test(x.url))fontes.push({titulo:x.title,url:x.url})})});
    return{texto,fontes,content:j.content};
  }
  throw new Error('A pesquisa demorou demais. Tente de novo.');
}
function extrairJSON(t){
  const m=t.match(/```json\s*([\s\S]*?)```/);const s=m?m[1]:t.slice(t.indexOf('{'),t.lastIndexOf('}')+1);
  return JSON.parse(s);
}
const lerArquivo=f=>new Promise((ok,err)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=err;r.readAsDataURL(f)});
async function blocoArquivo(f){
  if(f.type==='application/pdf')return{type:'document',source:{type:'base64',media_type:'application/pdf',data:await lerArquivo(f)}};
  return{type:'text',text:await f.text()};
}
function listaAssuntos(e){return e.disciplinas.map(d=>`## ${d.nome}\n`+d.assuntos.map(a=>`- [${a.id}] ${a.nome}`).join('\n')).join('\n')}

let iaBusy=null,iaRes=null;
async function iaRodar(tipo,fn){
  iaBusy=tipo;iaRes=null;render();
  try{iaRes={tipo,...await fn()}}catch(e){iaRes={tipo,erro:e.message}}
  iaBusy=null;render();
}

// 1) Ler edital (PDF/texto) e criar um edital novo
function iaEdital(){
  const f=document.getElementById('fEdital').files[0],txt=document.getElementById('tEdital').value.trim();
  const cargo=document.getElementById('cEdital').value.trim()||'principal';
  if(!f&&!txt)return toast('Envie o PDF do edital ou cole o texto.');
  iaRodar('edital',async()=>{
    const content=[];if(f)content.push(await blocoArquivo(f));if(txt)content.push({type:'text',text:txt});
    content.push({type:'text',text:`Extraia deste edital de concurso a estrutura da prova objetiva para o cargo ${cargo}.
Responda só com um bloco \`\`\`json no formato:
{"nome":"órgão/concurso curto","cargo":"","banca":"","dataProva":"AAAA-MM-DD ou vazio","disciplinas":[{"nome":"","questoes":0,"assuntos":["assunto curto (até 8 palavras)"]}]}
Condense o conteúdo programático em assuntos curtos e estudáveis, sem perder nenhum. Se algo não estiver no edital, deixe vazio.`});
    const r=await claude({system:'Você é especialista em editais de concursos públicos brasileiros. Seja fiel ao documento.',content});
    return{dados:extrairJSON(r.texto)};
  });
}
// 2) Raio-X de provas anteriores (PDF) — contagem real por assunto
function iaProva(){
  const e=E();const fs=[...document.getElementById('fProva').files];
  if(!fs.length)return toast('Envie ao menos um PDF de prova anterior.');
  iaRodar('prova',async()=>{
    const content=[];for(const f of fs)content.push(await blocoArquivo(f));
    content.push({type:'text',text:`Estas são provas anteriores. Classifique CADA questão em um dos assuntos abaixo (use o id entre colchetes). Se nenhum servir, use "novo" com disciplina e nome curto.
${listaAssuntos(e)}

Responda só com \`\`\`json:
{"provas":[{"descricao":"banca, órgão, cargo, ano","questoes":0}],"contagem":[{"id":"...","n":0}],"novos":[{"disciplina":"","assunto":"","n":0}],"temas":[{"id":"...","temas":["subtema específico que caiu"]}],"resumo":"2-3 frases sobre o perfil da banca nessas provas"}`});
    const r=await claude({system:'Você é analista de provas de concursos. Conte com precisão; não invente questões.',content,maxTokens:32000});
    return{dados:extrairJSON(r.texto),arquivos:fs.map(f=>f.name)};
  });
}
// 3) Pesquisa na web: histórico da banca/cargo e temas mais cobrados
function iaWeb(){
  const e=E();
  iaRodar('web',async()=>{
    const r=await claude({web:true,maxTokens:24000,
      system:'Você pesquisa o histórico de provas de concursos brasileiros para direcionar o estudo. Use a busca na web. Prefira fontes primárias (bancas, provas, gabaritos) e levantamentos de incidência de cursinhos. Seja honesto sobre incertezas.',
      content:`Concurso: ${e.nome} — cargo ${e.cargo||'?'} — banca ${e.banca||'?'}.
Pesquise provas anteriores deste concurso e de concursos parecidos da mesma banca (mesma área), e levantamentos de "assuntos mais cobrados".

const ICO={
  fogo:'<svg viewBox="0 0 24 24"><path d="M12 22c4 0 7-3 7-7 0-4-3-6-4-9-1 2-2 3-4 3 0-2 0-4-1-6-3 3-5 7-5 12 0 4 3 7 7 7z"/></svg>',

function minEm(d,ids){return S.sessoes.filter(s=>s.data===d&&(!ids||ids.has(s.assuntoId))).reduce((t,s)=>t+s.min,0)}
function donut(parts,size=132,th=16){
  const tot=parts.reduce((t,p)=>t+p.v,0)||1,r=(size-th)/2,c=2*Math.PI*r;let off=0;
  const segs=parts.map(p=>{const len=p.v/tot*c;const s=`<circle r="${r}" cx="${size/2}" cy="${size/2}" fill="none" stroke="${p.cor}" stroke-width="${th}" stroke-dasharray="${Math.max(0,len-2)} ${c}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size/2} ${size/2})"/>`;off+=len;return s}).join('');
  return segs;
}

function resultadoIA(){

      (d.contagem||[]).filter(c=>c.n>0).sort((a,b)=>b.n-a.n).slice(0,10).map(c=>{const r=acharAssunto(c.id);return r?`<li>${esc(r.a.nome)} — ${c.n}</li>`:''}).join('')+'</ol>';

function vDesempenho(){

function fecharModal(){$('#modal').classList.remove('on');origemModal?.focus();origemModal=null}
function toast(msg){modal(`<p style="margin-top:0">${esc(msg)}</p><div class="btns"><button class="pri" data-act="close">Ok</button></div>`)}
function abrirMaterial(assuntoId){

  <div class="btns"><button class="pri" data-act="saveLivre">Salvar</button><button class="ghost" data-act="close">Cancelar</button></div>`);

let timer=null,restante=0,decorrido=0,focoItem=null,pausado=false;
function iniciarFoco(itemId){
  const it=missaoHoje().itens.find(i=>i.id===itemId),r=acharAssunto(it.assuntoId);
  focoItem=itemId;restante=it.min*60;decorrido=0;pausado=false;
  $('#focusTag').textContent=(it.tipo==='revisao'?'Revisão · ':'Estudo · ')+r.d.nome;
  $('#focusTitle').textContent=r.a.nome;$('#fPause').textContent='Pausar';
  const materiais=materialDoAssunto(r),reader=$('#focusReader');
  reader.hidden=!materiais.length;
  reader.innerHTML=materiais.length?leitorMaterial(r,materiais,true):'';
  $('#focus').classList.add('on');tick();clearInterval(timer);timer=setInterval(tick,1000);
  $('#focus').scrollTop=0;
}
function tick(){
  if(!pausado&&restante>0){restante--;decorrido++}
  const m=Math.floor(restante/60),s=restante%60;
  $('#clock').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  document.title=restante>0?`${m}:${String(s).padStart(2,'0')} · posse`:'Tempo! · posse';
  if(restante===0&&timer){clearInterval(timer);timer=null;beep()}
}
function beep(){try{const a=new AudioContext(),o=a.createOscillator();o.frequency.value=880;o.connect(a.destination);o.start();o.stop(a.currentTime+.4)}catch(e){}}
function sairFoco(concluir){
  clearInterval(timer);timer=null;$('#focus').classList.remove('on');document.title='Posse';
  if(concluir)abrirLog(focoItem,Math.max(1,Math.round(decorrido/60)));
}
$('#fPause').onclick=()=>{pausado=!pausado;$('#fPause').textContent=pausado?'Continuar':'Pausar'};
$('#fDone').onclick=()=>sairFoco(true);
$('#fExit').onclick=()=>sairFoco(false);

  const e=E();

    material:()=>abrirMaterial(b.dataset.id),
    tecCopy:()=>tecCopy(b.dataset.id),
    replan:replanejar,
    abrirResgate,
    resgate:()=>{
      const min=Number(b.dataset.min);
      if(!TEMPOS_RESGATE.includes(min))return;
      fecharModal();replanejar(min);
    },
    hmais:()=>{const i=+b.dataset.i;S.rotina.horas[i]=Math.min(960,(+S.rotina.horas[i]||0)+30);refazerHoje();salvar();render()},
    hmenos:()=>{const i=+b.dataset.i;S.rotina.horas[i]=Math.max(0,(+S.rotina.horas[i]||0)-30);refazerHoje();salvar();render()},
    livre:abrirLivre,
    saveLivre:()=>{const id=$('#lvAss').value;const q=Math.max(0,+$('#lQ').value||0),ac=Math.min(q,Math.max(0,+$('#lA').value||0));fecharModal();registrar({tipo:$('#lvTipo').value,assuntoId:id},Math.max(0,+$('#lMin').value||0),q,ac,+$('#lD').value)},
    onb:()=>{
      const p=PRESETS.find(x=>x.id===$('#onbEd').value);if(!p){tab='ia';render();return}
      const ne=edDePreset(p);S.editais.push(ne);S.ativo=ne.id;
      const hs=x=>Math.round(Math.max(0,+String(x).replace(',','.')||0)*60);
      const u=hs($('#onbU').value),sa=hs($('#onbS').value),dm=hs($('#onbD').value),ini=$('#onbI').value||'19:00';
      S.rotina.horas=[dm,u,u,u,u,u,sa];S.rotina.inicio=[$('#onbIF').value||'09:00',ini,ini,ini,ini,ini,$('#onbIF').value||'09:00'];
      refazerHoje();salvar();tab='hoje';render();
    },
    saveLog:()=>{
      const it=missaoHoje().itens.find(i=>i.id===b.dataset.id);
      const q=Math.max(0,+$('#lQ').value||0),ac=Math.min(q,Math.max(0,+$('#lA').value||0));
      fecharModal();registrar(it,Math.max(0,+$('#lMin').value||0),q,ac,+$('#lD').value);
    },
    ativar:()=>{S.ativo=b.dataset.e;salvar();render()},
    delEd:()=>{if(confirm('Remover este edital? O histórico dele some da fila.')){S.editais=S.editais.filter(x=>x.id!==b.dataset.e);if(S.ativo===b.dataset.e)S.ativo=S.editais[0]?.id||null;salvar();render()}},
    addPreset:()=>{const ne=edDePreset(PRESETS.find(p=>p.id===b.dataset.p));S.editais.push(ne);S.ativo=ne.id;salvar();render()},
    addVazio:()=>{const ne=edDePreset({nome:'Novo concurso',disciplinas:[]});S.editais.push(ne);S.ativo=ne.id;salvar();render()},
    addDisc:()=>{e.disciplinas.push({id:uid(),nome:'Nova disciplina',peso:1,assuntos:[]});salvar();render()},
    addAss:()=>{e.disciplinas.find(d=>d.id===b.dataset.d).assuntos.push(novoAssunto('Novo assunto'));salvar();render()},
    delDisc:()=>{if(confirm('Remover a disciplina e seus assuntos?')){e.disciplinas=e.disciplinas.filter(d=>d.id!==b.dataset.d);refazerHoje();salvar();render()}},
    delAss:()=>{e.disciplinas.forEach(d=>d.assuntos=d.assuntos.filter(a=>a.id!==b.dataset.a));refazerHoje();salvar();render()},
    importCsv:()=>importarCsv($('#csv').value),
    applyCfg:()=>{refazerHoje();salvar();tab='hoje';render()},
    prov:()=>{S.ia.prov=b.dataset.p;salvar();render()},
    saveGemini:async()=>{
      const k=$('#gKey').value.trim();if(!k)return toast('Cole a chave do Gemini.');
      const sel=$('#gModel');
      if(sel&&k===S.ia.gkey){S.ia.gmodel=sel.value;salvar();render();return toast('Modelo salvo.')}
      b.disabled=true;b.textContent='Conectando…';
      try{const ms=await geminiModelos(k);if(!ms.length)throw new Error('Nenhum modelo Gemini disponível para esta chave.');
        S.ia.gkey=k;S.ia.gmodels=ms;S.ia.gmodel=ms.includes(S.ia.gmodel)?S.ia.gmodel:melhorModelo(ms);salvar();render();
        toast(`Gemini conectado. Modelo: ${S.ia.gmodel}. A IA já pode ser usada.`)}
      catch(err){b.disabled=false;b.textContent='Conectar';toast('Não consegui conectar: '+err.message)}
    },
    saveIA:()=>{if(!modoServidor)S.ia.key=$('#iaKey').value.trim();S.ia.model=$('#iaModel').value;salvar();toast('Configuração da IA salva.')},
    iaEdital,iaProva,iaWeb,mentor,aplicarIA,
    descartarIA:()=>{iaRes=null;render()},
    limparChat:()=>{S.chat=[];salvar();render()},
    export:()=>{const c={...S,ia:{...S.ia,key:'',gkey:''}};const u=URL.createObjectURL(new Blob([JSON.stringify(c,null,1)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=`posse-backup-${hoje()}.json`;a.click();URL.revokeObjectURL(u)},
    import:()=>$('#fileIn').click(),
    reset:()=>{if(confirm('Apagar todos os dados? Exporte um backup antes.')){S=novoEstado();salvar();render()}}
  };
  A[b.dataset.act]?.();
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'&&$('#modal').classList.contains('on'))fecharModal();
  if(ev.key==='Enter'&&ev.target.id==='mIn'&&!iaBusy)mentor();
});
$('#modal').onclick=ev=>{if(ev.target.id==='modal')fecharModal()};
document.addEventListener('change',ev=>{
  const t=ev.target,e=E();
  if(t.id==='fileIn'&&t.files[0]){t.files[0].text().then(x=>{try{const o=JSON.parse(x);if(o.v!==2||!o.editais)throw 0;o.ia={...S.ia};S=o;salvar();render();toast('Backup importado.')}catch(_){toast('Arquivo inválido.')}});return}
  if(t.id==='edSel'){S.ativo=t.value;salvar();render();return}
  if(t.dataset.r){S.rotina[t.dataset.r]=+t.value||0;refazerHoje();salvar();render();return}
  if(t.dataset.h!==undefined){S.rotina.horas[+t.dataset.h]=Math.round(Math.max(0,Math.min(16,+String(t.value).replace(',','.')||0))*60);refazerHoje();salvar();render();return}
  if(t.dataset.ini!==undefined){S.rotina.inicio[+t.dataset.ini]=t.value||'19:00';salvar();render();return}
  if(t.id==='onbEd'||t.id==='lvAss')return;
  if(t.dataset.ef&&e){e[t.dataset.ef]=t.value;salvar();render();return}
  const f=t.dataset.f;if(!f||!e)return;
  if(f==='dnome'||f==='dpeso'){const d=e.disciplinas.find(x=>x.id===t.dataset.d);if(f==='dnome')d.nome=t.value;else d.peso=+t.value||0}
  else{const r=acharAssunto(t.dataset.a);if(!r)return;
    if(f==='anome')r.a.nome=t.value;if(f==='aincid')r.a.incid=+t.value||0;if(f==='adom')r.a.dominio=+t.value;if(f==='atec')r.a.tecUrl=t.value.trim()}
  salvar();
});
function importarCsv(txt){
  const e=E();const linhas=txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!linhas.length)return toast('Cole ao menos uma linha.');
  let n=0;
  for(const l of linhas){
    const p=l.split(/[;\t]/).map(x=>x.trim());if(p.length<2||/^disciplina$/i.test(p[0]))continue;
    const[dn,an,inc,peso]=p;
    let d=e.disciplinas.find(x=>x.nome.toLowerCase()===dn.toLowerCase());
    if(!d){d={id:uid(),nome:dn,peso:+peso||1,assuntos:[]};e.disciplinas.push(d)}
    if(peso)d.peso=+peso||d.peso;
    let a=d.assuntos.find(x=>x.nome.toLowerCase()===an.toLowerCase());
    if(!a){a=novoAssunto(an);d.assuntos.push(a)}
    if(inc)a.incid=+String(inc).replace(',','.')||0;n++;
  }
  refazerHoje();salvar();render();toast(`${n} assuntos importados. A missão de hoje foi refeita.`);
}
if(!S.ativo&&S.editais.length)S.ativo=S.editais[0].id;
render();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
